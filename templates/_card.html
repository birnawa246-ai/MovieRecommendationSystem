<a class="movie-card" href="{{url_for('movie_page',movie_id=m.id)}}"><div class="poster" {% if m.poster_path %}style="background-image:url('{{config.TMDB_IMAGE_BASE}}{{m.poster_path}}')"{% endif %}>{% if not m.poster_path %}<span>🎬</span>{% endif %}<div class="score">★ {{'%.1f'|format(m.rating or 0)}}</div></div><div class="card-body"><h3>{{m.title}}</h3><p>{{(m.genres or 'Movie').replace('|',' · ')}}</p><small>{{m.release_date.year if m.release_date else 'Release date pending'}} · {{m.vote_count or 0}} votes</small></div></a>
