<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CineMatch{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><header class="nav"><a class="logo" href="{{url_for('dashboard')}}">🎬 CineMatch</a><div class="navlinks"><a href="{{url_for('dashboard')}}">Home</a>{% if session.get('user_id') %}<a href="{{url_for('all_movies')}}">All Movies</a><a href="{{url_for('admin')}}" class="admin-link">{% if user and user.role=='admin' %}Admin{% endif %}</a><a href="{{url_for('logout')}}">Logout</a>{% endif %}</div></header>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="toast {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</body></html>
